name: Console

# Builds the Coreves billing console (coreves-console/) and publishes a private
# GHCR image; on main it then triggers the Dokploy deployment when configured.
on:
  push:
    branches: [main]
    paths: ["coreves-console/**", ".github/workflows/console.yml"]
  pull_request:
    paths: ["coreves-console/**", ".github/workflows/console.yml"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/coreves-console

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coreves-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coreves-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./coreves-console
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.CONSOLE_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::CONSOLE_COMPOSE_ID not set — image pushed, deploy from Dokploy manually."
            exit 0
          fi
          bash .github/scripts/dokploy-deploy.sh
